name: Build Nator GameBoost iOS 18 Rootless

on:
  push:
    branches:
      - nator-gameboost-ios18
    paths:
      - '.github/workflows/build-nator-gameboost.yml'
      - 'nator-gameboost/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Theos and SDK
        uses: waruhachi/theos-action@v2.6.6
        with:
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false
          shook: false
          libsandy: false

      - name: Build package
        working-directory: nator-gameboost
        run: |
          set -euo pipefail
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          find packages -name '*.deb' -ls

      - name: Check architecture, dependencies and contents
        working-directory: nator-gameboost
        run: |
          set -euo pipefail
          DEB=$(find packages -name '*_iphoneos-arm64.deb' | head -1)
          test -n "$DEB"
          dpkg-deb -f "$DEB" Architecture | grep -x iphoneos-arm64
          dpkg-deb -f "$DEB" Package | grep -x com.nator.gameboost
          dpkg-deb -c "$DEB" | grep 'var/jb/usr/bin/natorgamerd'
          dpkg-deb -c "$DEB" | grep 'var/jb/Library/LaunchDaemons/com.nator.gameboost.plist'
          dpkg-deb -c "$DEB" | grep 'var/jb/Library/PreferenceLoader/Preferences/NatorGameBoost.plist'
          cp "$DEB" ../Nator_GameBoost_0.1.0_iphoneos-arm64.deb

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nator-GameBoost-iOS18-rootless
          path: Nator_GameBoost_0.1.0_iphoneos-arm64.deb

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=nator-gameboost-v0.1.0
          DEB=Nator_GameBoost_0.1.0_iphoneos-arm64.deb
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Nator GameBoost 0.1.0 — iOS 18 Dopamine 3"               --notes "Experimental app-process priority helper for rootless Dopamine 3. Complements built-in iOS Game Mode, attempts CPU nice adjustment for selected games. Does not override jetsam limits, GPU, or thermal protections. Not yet physically tested; no guaranteed FPS gain."
          fi
