<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e3eaf3">
  <title>Vuki Edit • Prévia interativa</title>
  <link rel="stylesheet" href="./style.css?v=6-20261020">
</head>
<body>
<div class="phone" data-preview-version="6">
  <header>
    <div class="brand"><b>Vuki</b><span id="projectName">Meu vídeo</span></div>
    <button class="export" disabled title="Exportação de vídeo disponível no app nativo">Exportar no app</button>
  </header>
  <main>
    <section class="workspace" aria-label="Prévia da edição">
      <div class="preview">
        <div class="stage">
          <div class="poster" id="demoPoster"><div class="sun"></div><div class="portrait"></div><div class="copy"><small>SEU PRÓXIMO FILME</small><b>Uma ideia.<br><em>Seu olhar.</em></b><span>VUKI EDIT</span></div></div>
          <video id="previewVideo" playsinline preload="metadata" hidden></video>
          <img id="previewImage" alt="Mídia importada" hidden>
          <div id="shapeOverlay" class="shape-overlay" hidden></div>
          <div id="textOverlay" class="text-overlay" hidden></div>
        </div>
      </div>
    </section>
    <section class="transport" aria-label="Reprodução e histórico">
      <span id="timeReadout"><b>00:00</b> / 00:15</span>
      <div><button id="undo" aria-label="Desfazer" disabled></button><button id="play" class="play" aria-label="Reproduzir vídeo" disabled></button><button id="redo" aria-label="Refazer" disabled></button></div>
      <button id="clipSettings" aria-label="Opções do vídeo" aria-controls="sheet"></button>
    </section>
    <section class="timeline" aria-label="Linha do tempo da prévia">
      <div class="ruler"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span></div>
      <div class="lane video"><button class="plus" aria-label="Importar mídia"></button><button class="clip selected" aria-label="Opções do vídeo"><span class="frames"><i></i><i></i><i></i><i></i><i></i><i></i></span></button></div>
      <div class="lane audio"><button class="music" aria-label="Abrir áudio"></button><div class="clip sound"><span id="audioName">Adicionar uma trilha</span></div></div>
      <div class="needle"><i></i></div>
    </section>
    <section id="sheet" class="sheet hidden" role="region" aria-labelledby="sheetTitle">
      <div class="sheet-head"><div><strong id="sheetTitle">Ferramentas</strong><p id="sheetHint"></p></div><button id="close" aria-label="Concluir ajustes"></button></div>
      <div id="sheetBody"></div>
    </section>
  </main>
  <nav id="toolbar" aria-label="Ferramentas do editor"></nav>
  <p class="preview-note">Prévia interativa · exportação de vídeo no app</p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</div>
<input id="mediaFile" type="file" accept="video/*,image/*" hidden>
<input id="audioFile" type="file" accept="audio/*" hidden>
<audio id="audioTrack" preload="metadata"></audio>
<script src="./app.js?v=6-20261020"></script>
</body>
</html>
